<!doctype html>
<html>
<head>
  <title>MNIST Predictions</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #f5f5f5; margin: 0; padding: 20px; }
    h1   { margin-bottom: 10px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      max-width: 1100px;
      margin: 30px auto;
    }
    .card {
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      text-align: left;
    }
    .card img {
      width: 100%;
      image-rendering: pixelated;
      display: block;
      margin-bottom: 8px;
    }
    .card p { margin: 4px 0; font-size: 14px; }
    .ok    { color: green; font-weight: bold; }
    .wrong { color: red;   font-weight: bold; }

    .conf {
      font-size: 12px;
      color: #555;
      margin-bottom: 8px;
    }

    .bars {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 8px;
      border-top: 1px solid #eee;
      padding-top: 8px;
    }
    .bar-row {
      display: grid;
      grid-template-columns: 14px 1fr 42px;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }
    .bar-label { font-weight: 600; text-align: center; }
    .bar-track {
      background: #eee;
      border-radius: 3px;
      height: 10px;
      overflow: hidden;
    }
    .bar-fill {
      background: #3b82f6;
      height: 100%;
      width: 0%;
    }
    .bar-row.is-predicted .bar-fill { background: #16a34a; }
    .bar-value { text-align: right; color: #555; }

    button {
      padding: 12px 28px; font-size: 16px; cursor: pointer;
      border: none; border-radius: 6px; background: #333; color: #fff;
      margin-top: 20px;
    }
    button:hover { background: #555; }
  </style>
</head>
<body>
  <h1>MNIST — Random 10 Test Images</h1>

  <div class="grid">
    {% for it in items %}
      <div class="card">
        <img src="data:image/png;base64,{{ it.img }}">
        <p>Actual: {{ it.actual }}</p>
        <p class="{{ 'ok' if it.correct else 'wrong' }}">
          Predicted: {{ it.predicted }}
        </p>
        <p class="conf">Confidence: {{ it.confidence }}%</p>

        <div class="bars">
          {% for p in it.probabilities %}
            <div class="bar-row {% if p.digit == it.predicted %}is-predicted{% endif %}">
              <div class="bar-label">{{ p.digit }}</div>
              <div class="bar-track">
                <div class="bar-fill" style="width: {{ p.percent }}%;"></div>
              </div>
              <div class="bar-value">{{ p.percent }}%</div>
            </div>
          {% endfor %}
        </div>
      </div>
    {% endfor %}
  </div>

  <button onclick="location.reload()">🔄 Refresh</button>
</body>
</html>
